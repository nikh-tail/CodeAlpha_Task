      <rect x="256" y="4" width="65" height="22" rx="6" fill="#1F1A3D"/><text x="288" y="19" fill="#A78BFA" font-family="sans-serif" font-size="10" text-anchor="middle">MASONRY</text>
      <rect x="327" y="4" width="65" height="22" rx="6" fill="#1F1A3D"/><text x="359" y="19" fill="#A78BFA" font-family="sans-serif" font-size="10" text-anchor="middle">COMPACT</text>

