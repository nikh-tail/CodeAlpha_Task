<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ll-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#090D13"/>
    </linearGradient>
    <linearGradient id="ll-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ll-bg)"/>
  <circle cx="720" cy="120" r="150" fill="rgba(245, 158, 11, 0.08)"/>
  <circle cx="100" cy="360" r="160" fill="rgba(16, 185, 129, 0.08)"/>
  <g transform="translate(40, 30)">
    <rect width="720" height="420" rx="14" fill="#0D1117" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <path d="M0,14 Q0,0 14,0 L706,0 Q720,0 720,14 L720,44 L0,44 Z" fill="#161B22"/>
    <circle cx="24" cy="22" r="5.5" fill="#EF4444"/><circle cx="40" cy="22" r="5.5" fill="#F59E0B"/><circle cx="56" cy="22" r="5.5" fill="#10B981"/>
    <text x="360" y="26" fill="#E6EDF3" font-family="'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">⚡ LeetLocal — Offline C++ LeetCode Compiler &amp; Runner</text>
    
    <!-- URL Ingestion Bar -->
    <rect x="24" y="56" width="460" height="28" rx="6" fill="#0D1117" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <text x="36" y="74" fill="#8B949E" font-family="'Fira Code', monospace" font-size="10">🔗 https://leetcode.com/problems/trapping-rain-water/</text>
    <rect x="492" y="56" width="95" height="28" rx="6" fill="#F59E0B"/>
    <text x="539" y="74" fill="#0D1117" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Fetch Problem</text>
    
    <rect x="595" y="56" width="100" height="28" rx="6" fill="#238636"/>
    <text x="645" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">▶ Run C++ (F5)</text>

    <!-- Editor & Console Split Panels -->
    <!-- Left: Code Editor -->
    <g transform="translate(24, 96)">
      <rect width="390" height="300" rx="8" fill="#090D13" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <!-- Editor tab bar -->
      <path d="M0,8 Q0,0 8,0 L382,0 Q390,0 390,8 L390,30 L0,30 Z" fill="#161B22"/>
      <rect x="10" y="6" width="120" height="20" rx="4" fill="#090D13"/>
      <text x="70" y="19" fill="#58A6FF" font-family="monospace" font-size="10" text-anchor="middle">📄 solution.cpp (C++17)</text>
      <text x="145" y="19" fill="#8B949E" font-family="monospace" font-size="10">⚡ clang++ -O2</text>
      <!-- Code lines -->
      <text x="16" y="54" fill="#FF7B72" font-family="'Fira Code', monospace" font-size="10">#include <tspan fill="#A5D6FF">&lt;vector&gt;</tspan></text>
      <text x="16" y="72" fill="#FF7B72" font-family="'Fira Code', monospace" font-size="10">#include <tspan fill="#A5D6FF">&lt;algorithm&gt;</tspan></text>
      <text x="16" y="94" fill="#FF7B72" font-family="'Fira Code', monospace" font-size="10">class <tspan fill="#FFA657">Solution</tspan> {</text>
      <text x="16" y="112" fill="#FF7B72" font-family="'Fira Code', monospace" font-size="10">public:</text>
      <text x="32" y="130" fill="#79C0FF" font-family="'Fira Code', monospace" font-size="10">int <tspan fill="#D2A8FF">trap</tspan>(std::vector&lt;<tspan fill="#79C0FF">int</tspan>&gt;&amp; <tspan fill="#FFA657">height</tspan>) {</text>
      <text x="48" y="148" fill="#8B949E" font-family="'Fira Code', monospace" font-size="9.5">// Two-pointer optimal O(N) time O(1) space</text>
      <text x="48" y="166" fill="#79C0FF" font-family="'Fira Code', monospace" font-size="10">int <tspan fill="#C9D1D9">left = 0, right = height.size() - 1;</tspan></text>
      <text x="48" y="184" fill="#79C0FF" font-family="'Fira Code', monospace" font-size="10">int <tspan fill="#C9D1D9">leftMax = 0, rightMax = 0, ans = 0;</tspan></text>
      <text x="48" y="202" fill="#FF7B72" font-family="'Fira Code', monospace" font-size="10">while <tspan fill="#C9D1D9">(left &lt; right) {</tspan></text>
      <text x="64" y="220" fill="#FF7B72" font-family="'Fira Code', monospace" font-size="10">if <tspan fill="#C9D1D9">(height[left] &lt; height[right]) {</tspan></text>
      <text x="80" y="238" fill="#C9D1D9" font-family="'Fira Code', monospace" font-size="10">height[left] &gt;= leftMax ? leftMax = height[left] : ans += leftMax - height[left];</text>
      <text x="80" y="256" fill="#C9D1D9" font-family="'Fira Code', monospace" font-size="10">left++;</text>
      <text x="48" y="274" fill="#C9D1D9" font-family="'Fira Code', monospace" font-size="10">} ...</text>
      <text x="16" y="290" fill="#FF7B72" font-family="'Fira Code', monospace" font-size="10">};</text>
    </g>

    <!-- Right: Benchmark & Test Results -->
    <g transform="translate(424, 96)">
      <rect width="272" height="300" rx="8" fill="#090D13" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <path d="M0,8 Q0,0 8,0 L264,0 Q272,0 272,8 L272,30 L0,30 Z" fill="#161B22"/>
      <text x="14" y="20" fill="#3FB950" font-family="sans-serif" font-size="10.5" font-weight="700">✓ ALL TEST CASES PASSED</text>
      
      <!-- Result banner -->
      <rect x="12" y="40" width="248" height="62" rx="6" fill="rgba(46, 160, 67, 0.15)" stroke="#2EA043" stroke-width="1"/>
      <text x="24" y="62" fill="#3FB950" font-family="sans-serif" font-size="14" font-weight="800">Accepted (20/20 Passed)</text>
      <text x="24" y="78" fill="#C9D1D9" font-family="'Fira Code', monospace" font-size="9.5">Runtime: <tspan fill="#3FB950" font-weight="700">0 ms (100.00%)</tspan></text>
      <text x="24" y="92" fill="#C9D1D9" font-family="'Fira Code', monospace" font-size="9.5">Memory: <tspan fill="#58A6FF">14.2 MB (O(1) Aux Space)</tspan></text>

      <!-- Case tabs -->
      <g transform="translate(12, 112)">
        <rect x="0" y="0" width="55" height="20" rx="4" fill="#238636"/><text x="27" y="14" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Case 1</text>
        <rect x="60" y="0" width="55" height="20" rx="4" fill="#161B22"/><text x="87" y="14" fill="#8B949E" font-family="sans-serif" font-size="9" text-anchor="middle">Case 2</text>
        <rect x="120" y="0" width="55" height="20" rx="4" fill="#161B22"/><text x="147" y="14" fill="#8B949E" font-family="sans-serif" font-size="9" text-anchor="middle">Case 3</text>
      </g>

      <!-- Diff / Output -->
      <rect x="12" y="140" width="248" height="80" rx="6" fill="#161B22"/>
      <text x="20" y="158" fill="#8B949E" font-family="'Fira Code', monospace" font-size="8.5">Input: [0,1,0,2,1,0,1,3,2,1,2,1]</text>
      <text x="20" y="176" fill="#3FB950" font-family="'Fira Code', monospace" font-size="8.5">Expected Output: 6</text>
      <text x="20" y="194" fill="#3FB950" font-family="'Fira Code', monospace" font-size="8.5">Actual Output:   6  [MATCH ✓]</text>
      <text x="20" y="210" fill="#58A6FF" font-family="'Fira Code', monospace" font-size="8">stdout: Optimal 2-pointer execution</text>

      <!-- Bottom Feature -->
      <rect x="12" y="230" width="248" height="60" rx="6" fill="#0D1117" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="20" y="248" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">⚡ 100% Offline C++ Architecture</text>
      <text x="20" y="264" fill="#8B949E" font-family="sans-serif" font-size="8.5">Automatic TreeNode/ListNode serialization</text>
      <text x="20" y="278" fill="#F59E0B" font-family="sans-serif" font-size="8" font-weight="600">🚀 300+ LeetCode problems solved &amp; benchmarked</text>
    </g>
  </g>
</svg>