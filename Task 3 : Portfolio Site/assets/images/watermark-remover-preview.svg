<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="50%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#060B14"/>
    </linearGradient>
    <linearGradient id="wm-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#wm-bg)"/>
  <circle cx="140" cy="100" r="150" fill="rgba(6, 182, 212, 0.1)"/>
  <circle cx="660" cy="380" r="160" fill="rgba(59, 130, 246, 0.1)"/>
  <g transform="translate(40, 30)">
    <rect width="720" height="420" rx="14" fill="#0A101D" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <path d="M0,14 Q0,0 14,0 L706,0 Q720,0 720,14 L720,44 L0,44 Z" fill="#101A2E"/>
    <circle cx="24" cy="22" r="5.5" fill="#EF4444"/><circle cx="40" cy="22" r="5.5" fill="#F59E0B"/><circle cx="56" cy="22" r="5.5" fill="#10B981"/>
    <text x="360" y="26" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🪄 AI Watermark Remover &amp; Computer Vision Inpainting Engine</text>
    
    <!-- Top toolbar -->
    <g transform="translate(24, 56)">
      <rect width="120" height="28" rx="6" fill="#0284C7"/>
      <text x="60" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">📁 Upload Image</text>

      <rect x="130" y="0" width="130" height="28" rx="6" fill="#132238" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="195" y="18" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">Auto-Detect Overlay</text>

      <rect x="270" y="0" width="120" height="28" rx="6" fill="#132238"/>
      <text x="330" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">OpenCV Telea Inpaint</text>

      <rect x="400" y="0" width="120" height="28" rx="6" fill="#132238"/>
      <text x="460" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Navier-Stokes Alg.</text>

      <rect x="550" y="0" width="122" height="28" rx="6" fill="#10B981"/>
      <text x="611" y="18" fill="#042F2E" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">⚡ Remove Artifacts</text>
    </g>

    <!-- Side-by-side Before/After Visualization -->
    <g transform="translate(24, 100)">
      <!-- Left: Before (With Watermark) -->
      <g transform="translate(0, 0)">
        <rect width="326" height="215" rx="10" fill="#16233B"/>
        <rect x="8" y="8" width="310" height="199" rx="6" fill="#1E3A5F"/>
        <!-- Simulated Landscape Artwork -->
        <circle cx="160" cy="80" r="40" fill="#F59E0B"/>
        <polygon points="20,200 120,90 220,200" fill="#0F766E"/>
        <polygon points="140,200 230,110 310,200" fill="#115E59"/>
        <!-- Watermark Overlay (Highlighted with red box) -->
        <rect x="60" y="85" width="190" height="44" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="155" y="112" fill="#FFFFFF" opacity="0.6" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">SAMPLE WATERMARK</text>
        <rect x="16" y="16" width="110" height="20" rx="4" fill="rgba(0,0,0,0.7)"/>
        <text x="71" y="30" fill="#EF4444" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">⚠ Original (With Artifacts)</text>
      </g>

      <!-- Right: After (Inpainted Clean Result) -->
      <g transform="translate(346, 0)">
        <rect width="326" height="215" rx="10" fill="#16233B" stroke="#38BDF8" stroke-width="1.5"/>
        <rect x="8" y="8" width="310" height="199" rx="6" fill="#1E3A5F"/>
        <!-- Reconstructed clean background -->
        <circle cx="160" cy="80" r="40" fill="#F59E0B"/>
        <polygon points="20,200 120,90 220,200" fill="#0F766E"/>
        <polygon points="140,200 230,110 310,200" fill="#115E59"/>
        <!-- Seamless inpaint glow -->
        <circle cx="155" cy="107" r="35" fill="rgba(56, 189, 248, 0.15)"/>
        <rect x="16" y="16" width="130" height="20" rx="4" fill="rgba(16, 185, 129, 0.8)"/>
        <text x="81" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">✓ Inpainted (Zero Artifacts)</text>
      </g>
    </g>

    <!-- Bottom Feature Summary -->
    <g transform="translate(24, 328)">
      <rect width="672" height="72" rx="8" fill="#0E1729" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="20" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">⚡ Computer Vision &amp; Image Processing Pipeline</text>
      <text x="20" y="42" fill="#94A3B8" font-family="sans-serif" font-size="9.5">Automated thresholding, morphological dilation masks, and OpenCV Fast Marching (Telea) &amp; Navier-Stokes restoration.</text>
      <text x="20" y="58" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="8.5">Python 3.10 • OpenCV cv2.inpaint • NumPy • Artifact Detection • Batch Processing Ready</text>
    </g>
  </g>
</svg>